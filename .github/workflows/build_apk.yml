name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Java setup (AGP 9.x requires JDK 21) ──────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── 3. Set up Gradle (caches + installs wrapper binary) ──────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── 4. Install the Gradle wrapper script if missing ───────────────────────
      # The repo contains gradle-wrapper.properties but the wrapper JAR may be
      # missing. We download Gradle, generate the wrapper files, and ensure
      # gradlew is executable.
      - name: Generate Gradle wrapper
        run: |
          # Read the declared Gradle version from the wrapper properties
          GRADLE_VERSION=$(grep -oP '(?<=gradle-)[0-9]+\.[0-9]+(\.[0-9]+)?(?=-bin)' gradle/wrapper/gradle-wrapper.properties)
          echo "Declared Gradle version: $GRADLE_VERSION"

          # Download and unpack Gradle distribution
          GRADLE_URL="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          curl -fsSL "$GRADLE_URL" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-install
          GRADLE_BIN="/tmp/gradle-install/gradle-${GRADLE_VERSION}/bin/gradle"
          chmod +x "$GRADLE_BIN"

          # Use that Gradle binary to re-generate gradlew + wrapper jar
          "$GRADLE_BIN" wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
          chmod +x gradlew
          echo "gradlew created successfully."
          ls -la gradlew gradle/wrapper/

      # ── 5. Generate a debug keystore ─────────────────────────────────────────
      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "debug.keystore created."

      # ── 6. Copy .env.example → app/.env for the secrets-gradle-plugin ────────
      - name: Create .env from example
        run: |
          if [ -f ".env.example" ]; then
            cp .env.example app/.env
            echo "app/.env created from .env.example"
          fi

      # ── 7. Ensure google-services.json exists ─────────────────────────────────
      - name: Ensure google-services.json
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo '{
              "project_info": {
                "project_number": "1234567890",
                "project_id": "live-cam",
                "storage_bucket": "live-cam.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                    "android_client_info": {
                      "package_name": "com.aistudio.lovecctv.cam"
                    }
                  },
                  "api_key": [
                    {
                      "current_key": "AIzaSyDummyKeyForBuild"
                    }
                  ]
                }
              ],
              "configuration_version": "1"
            }' > app/google-services.json
            echo "google-services.json placeholder created."
          else
            echo "google-services.json already exists."
          fi

      # ── 8. Cache Gradle dependencies ─────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 9. Build debug APK ────────────────────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          # Provide values for release signingConfig env vars so Gradle config
          # phase does not fail (storeFile must point to an existing file).
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android

      # ── 10. Upload APK artifact ───────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: love-cctv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
